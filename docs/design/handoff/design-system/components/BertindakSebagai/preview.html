<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>BertindakSebagai — pratinjau</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; }
body { background: var(--kertas); }
/* tanah: komponen selalu tampil di atas kertas, apa pun latar bingkai pratinjau */
.tanah { background: var(--kertas); color: var(--tinta); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; padding: var(--s20); min-height: 100vh; box-sizing: border-box; }
.pk { display: flex; flex-direction: column; gap: 10px; max-width: 372px; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--laut); outline-offset: 2px; }
a { color: var(--laut); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="tanah"><div class="pk">
<div style="background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--radius-kartu); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px"><span style="display: flex; flex-direction: column"><span style="font-weight: 700">Pnt. Hendrik Rumagit</span><span style="font-size: 13px; color: var(--tinta3)">Jabatan Anda</span></span><div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="font-size: 13px; font-weight: 700; border-radius: var(--radius-lencana); padding: 3px 9px; border: 1.5px solid var(--tinta); background: var(--permukaan)">Penatua Kolom 7</span><span style="font-size: 13px; font-weight: 700; border-radius: var(--radius-lencana); padding: 3px 9px; border: 1.5px solid var(--tinta); background: var(--permukaan)">Ketua Komisi Diakonia</span></div></div>
<div style="background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--radius-kartu); padding: 12px 16px"><div style="font-weight: 600">5 data menunggu verifikasi</div><div style="font-size: 13px; color: var(--tinta3)">Sebagai Penatua Kolom 7 · 2 permohonan · 2 peristiwa</div></div>
<div style="background: var(--lautLembut); border-radius: var(--radius-isian); padding: 12px 14px; font-size: 14px"><strong>Anda bertindak sebagai Penatua Kolom 7.</strong> <span style="color: var(--tinta2)">Hanya jabatan ini yang berwenang.</span></div>
<div style="border: 1.5px solid var(--tinta); border-radius: var(--radius-isian); background: var(--permukaan); padding: 12px 14px; font-size: 14px"><strong>Dua jabatan Anda dapat menyetujui ini.</strong> Pilih salah satu.</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><button style="flex: 1 1 150px; min-height: 52px; border-radius: var(--radius-kartu); border: 1.5px solid var(--tinta); background: var(--permukaan); font-weight: 700; text-align: center">Sebagai Penatua Kolom 7</button><button style="flex: 1 1 150px; min-height: 52px; border-radius: var(--radius-kartu); border: 1.5px solid var(--tinta); background: var(--permukaan); font-weight: 700; text-align: center">Sebagai Ketua Komisi Diakonia</button></div>
</div></div>
</body>
</html>
