<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Sakelar — pratinjau</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; }
body { background: var(--kertas); }
/* tanah: komponen selalu tampil di atas kertas, apa pun latar bingkai pratinjau */
.tanah { background: var(--kertas); color: var(--tinta); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; padding: var(--s20); min-height: 100vh; box-sizing: border-box; }
.pk { display: flex; flex-direction: column; gap: 10px; max-width: 372px; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--laut); outline-offset: 2px; }
a { color: var(--laut); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="tanah"><div class="pk">
<div style="display: flex; align-items: center; gap: 16px"><span style="display: inline-block; width: 56px; height: 32px; border-radius: 16px; background: var(--permukaan); border: 1.5px solid var(--tinta); box-sizing: border-box; position: relative"><span style="position: absolute; top: 3px; left: 3px; width: 23px; height: 23px; border-radius: 50%; background: var(--tinta)"></span></span><span style="font-size: 14px; color: var(--tinta2)">Mati</span><span style="display: inline-block; width: 56px; height: 32px; border-radius: 16px; background: var(--tinta); border: 1.5px solid var(--tinta); box-sizing: border-box; position: relative"><span style="position: absolute; top: 3px; left: 28px; width: 23px; height: 23px; border-radius: 50%; background: var(--permukaan)"></span></span><span style="font-size: 14px; color: var(--tinta2)">Hidup</span></div>
</div></div>
</body>
</html>
