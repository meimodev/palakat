<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>KartuPersetujuan — pratinjau</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; }
body { background: var(--kertas); }
/* tanah: komponen selalu tampil di atas kertas, apa pun latar bingkai pratinjau */
.tanah { background: var(--kertas); color: var(--tinta); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; padding: var(--s20); min-height: 100vh; box-sizing: border-box; }
.pk { display: flex; flex-direction: column; gap: 10px; max-width: 372px; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--laut); outline-offset: 2px; }
a { color: var(--laut); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="tanah"><div class="pk">
<div style="border: 1.5px dashed var(--putus); border-radius: var(--radius-kartu); padding: 14px 16px"><div style="font-weight: 700">Persetujuan belum dicatat</div><div style="margin-top: 8px; min-height: 44px; border-radius: var(--radius-isian); border: 1.5px solid var(--tinta); background: var(--permukaan); font-weight: 700; display: flex; align-items: center; justify-content: center">Catat persetujuan</div></div>
<div style="background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--radius-kartu); padding: 14px 16px"><div style="font-weight: 700">Persetujuan sudah dicatat</div><div style="font-size: 14px; margin-top: 4px"><span style="color: var(--tinta2)">Pemberi persetujuan:</span> <strong>Pnt. Jefry Wowor</strong>, Ketua BPMJ</div><div style="font-size: 14px; color: var(--tinta2)">08/11/2026 · cara: notulen rapat</div><div style="font-size: 13px; color: var(--tinta3); border-top: 1px dashed var(--garisTegas); margin-top: 8px; padding-top: 8px">Dicatat oleh Meiske L., 16/11/2026 11.20. Pernyataan Bendahara, bukan persetujuan di dalam aplikasi.</div></div>
<div style="font-size: 14px; color: var(--tinta2); padding: 0 2px"><strong style="color: var(--tinta)">Tidak diperlukan</strong> (aturan: transaksi rutin)</div>
</div></div>
</body>
</html>
