<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Rangka — pratinjau</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; }
body { background: var(--kertas); }
/* tanah: komponen selalu tampil di atas kertas, apa pun latar bingkai pratinjau */
.tanah { background: var(--kertas); color: var(--tinta); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; padding: var(--s20); min-height: 100vh; box-sizing: border-box; }
.pk { display: flex; flex-direction: column; gap: 10px; max-width: 372px; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--laut); outline-offset: 2px; }
a { color: var(--laut); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="tanah"><div class="pk">
<div role="status" aria-label="Memuat" style="display: flex; flex-direction: column; gap: 12px"><div style="height: 72px; border-radius: var(--radius-isian); background: var(--garis)"></div><div style="height: 56px; border-radius: var(--radius-isian); background: var(--garis)"></div><div style="height: 56px; border-radius: var(--radius-isian); background: var(--garis)"></div></div>
<div style="font-size: 13px; color: var(--tinta3)">Bentuk isi tampil lebih dulu; tidak ada angka sementara yang bisa disangka angka sebenarnya.</div>
</div></div>
</body>
</html>
