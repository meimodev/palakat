<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>LencanaStatus — pratinjau</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; }
body { background: var(--kertas); }
/* tanah: komponen selalu tampil di atas kertas, apa pun latar bingkai pratinjau */
.tanah { background: var(--kertas); color: var(--tinta); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; padding: var(--s20); min-height: 100vh; box-sizing: border-box; }
.pk { display: flex; flex-direction: column; gap: 10px; max-width: 372px; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--laut); outline-offset: 2px; }
a { color: var(--laut); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="tanah"><div class="pk">
<div style="font-size: 13px; color: var(--tinta2)">Transaksi</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-lencana); color: var(--tinta2); border: 1.5px dashed var(--putus)">Draf</span>
<span style="font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-lencana); color: var(--laut); border: 1.5px solid var(--laut); background: var(--permukaan)">Sudah diperiksa</span>
<span style="font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-lencana); color: var(--permukaan); border: 1.5px solid var(--tinta); background: var(--tinta)">Dibukukan</span>
<span style="font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-lencana); color: var(--tinta2); border: 1.5px solid var(--tinta3); background: var(--permukaan)">Dibalik</span>
<span style="font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-lencana); color: var(--tinta2); border: 1.5px solid var(--garis); background: var(--garis)">Dibatalkan</span>
</div>
<div style="font-size: 13px; color: var(--tinta2)">Bulan · rekonsiliasi</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-lencana); color: var(--tinta2); border: 1.5px solid var(--tinta3)">Belum ditutup</span>
<span style="font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-lencana); color: var(--permukaan); border: 1.5px solid var(--tinta); background: var(--tinta)">Sudah ditutup</span>
<span style="font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-lencana); color: var(--tinta2); border: 1.5px solid var(--tinta3)">Sedang dikerjakan</span>
<span style="font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-lencana); color: var(--diLaut); border: 1.5px solid var(--laut); background: var(--laut)">Sudah dipastikan</span>
<span style="font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-lencana); color: var(--bata); border: 1.5px solid var(--bata); background: var(--permukaan)">Perlu dipastikan lagi</span>
</div>
</div></div>
</body>
</html>
