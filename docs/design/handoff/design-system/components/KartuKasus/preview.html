<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>KartuKasus — pratinjau</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; }
body { background: var(--kertas); }
/* tanah: komponen selalu tampil di atas kertas, apa pun latar bingkai pratinjau */
.tanah { background: var(--kertas); color: var(--tinta); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; padding: var(--s20); min-height: 100vh; box-sizing: border-box; }
.pk { display: flex; flex-direction: column; gap: 10px; max-width: 372px; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--laut); outline-offset: 2px; }
a { color: var(--laut); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="tanah"><div class="pk">
<div style="background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--radius-kartu); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; gap: 16px; align-items: center"><span style="font-weight: 700">Panitia Natal</span><span style="font-family: var(--font-mono); font-weight: 500">Rp650.000</span></div><div style="font-size: 14px; color: var(--tinta2); font-size: 13px">Diberikan kepada: Sdr. Rivo Mandagi</div><div style="height: 8px; border-radius: 4px; border: 1.5px dashed var(--putus); overflow: hidden; box-sizing: border-box"><div style="height: 100%; width: 57%; background: var(--tinta)"></div></div><div style="font-size: 14px; color: var(--tinta2); font-size: 13px">Sebagian dipertanggungjawabkan · jatuh tempo 30/11/2026</div></div>
</div></div>
</body>
</html>
