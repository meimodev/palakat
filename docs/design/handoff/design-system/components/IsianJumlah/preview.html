<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>IsianJumlah — pratinjau</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; }
body { background: var(--kertas); }
/* tanah: komponen selalu tampil di atas kertas, apa pun latar bingkai pratinjau */
.tanah { background: var(--kertas); color: var(--tinta); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; padding: var(--s20); min-height: 100vh; box-sizing: border-box; }
.pk { display: flex; flex-direction: column; gap: 10px; max-width: 372px; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--laut); outline-offset: 2px; }
a { color: var(--laut); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="tanah"><div class="pk">
<div style="background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--radius-kartu); padding: 16px">
<label for="k-jml" style="font-size: 14px; color: var(--tinta2)">Jumlah (Rp)</label>
<div style="display: flex; align-items: baseline; gap: 6px; font-family: var(--font-mono); border-bottom: 2px solid var(--tinta); padding-bottom: 4px"><span style="font-size: 20px; color: var(--tinta3)">Rp</span><input id="k-jml" inputmode="numeric" readonly="" style="flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; font-family: var(--font-mono); font-size: 30px; font-weight: 500; letter-spacing: -1px; padding: 0; min-height: 44px; box-sizing: border-box" value="1.250.000"/></div>
</div>
</div></div>
</body>
</html>
