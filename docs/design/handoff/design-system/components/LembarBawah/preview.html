<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>LembarBawah — pratinjau</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; }
body { background: var(--kertas); }
/* tanah: komponen selalu tampil di atas kertas, apa pun latar bingkai pratinjau */
.tanah { background: var(--kertas); color: var(--tinta); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; padding: var(--s20); min-height: 100vh; box-sizing: border-box; }
.pk { display: flex; flex-direction: column; gap: 10px; max-width: 372px; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--laut); outline-offset: 2px; }
a { color: var(--laut); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="tanah"><div class="pk">
<div style="background: var(--tinta3); border-radius: var(--radius-kartu); padding: 28px 0 0"><div style="background: var(--permukaan); border-radius: var(--radius-lembar) var(--radius-lembar) 0 0; padding: 10px 16px 16px"><div style="width: 40px; height: 4px; border-radius: 2px; background: var(--garisTegas); margin: 0 auto 12px"></div><div style="font-weight: 700; font-size: 17px">Catat apa?</div><div style="font-size: 14px; color: var(--tinta2)">Pendapatan · Belanja · Persembahan · Pindah antar Kas/Bank</div></div></div>
</div></div>
</body>
</html>
