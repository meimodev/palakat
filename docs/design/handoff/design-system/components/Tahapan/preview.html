<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tahapan — pratinjau</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; }
body { background: var(--kertas); }
/* tanah: komponen selalu tampil di atas kertas, apa pun latar bingkai pratinjau */
.tanah { background: var(--kertas); color: var(--tinta); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; padding: var(--s20); min-height: 100vh; box-sizing: border-box; }
.pk { display: flex; flex-direction: column; gap: 10px; max-width: 372px; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--laut); outline-offset: 2px; }
a { color: var(--laut); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="tanah"><div class="pk">
<div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="display: inline-flex; align-items: center; min-height: 30px; padding: 0 10px; border-radius: var(--radius-chip); font-size: 13px; font-weight: 700; background: var(--tinta); color: var(--permukaan); border: 1.5px solid var(--tinta)">1 · Draf</span><span style="display: inline-flex; align-items: center; min-height: 30px; padding: 0 10px; border-radius: var(--radius-chip); font-size: 13px; font-weight: 700; background: var(--tinta); color: var(--permukaan); border: 1.5px solid var(--tinta)">2 · Sudah diperiksa</span><span style="display: inline-flex; align-items: center; min-height: 30px; padding: 0 10px; border-radius: var(--radius-chip); font-size: 13px; font-weight: 700; color: var(--tinta3); border: 1.5px dashed var(--putus)">3 · Diterbitkan</span></div>
</div></div>
</body>
</html>
