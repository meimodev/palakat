<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tombol — pratinjau</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; }
body { background: var(--kertas); }
/* tanah: komponen selalu tampil di atas kertas, apa pun latar bingkai pratinjau */
.tanah { background: var(--kertas); color: var(--tinta); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; padding: var(--s20); min-height: 100vh; box-sizing: border-box; }
.pk { display: flex; flex-direction: column; gap: 10px; max-width: 372px; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--laut); outline-offset: 2px; }
a { color: var(--laut); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="tanah"><div class="pk">
<button style="min-height: 52px; border-radius: var(--radius-kartu); border: 0; background: var(--laut); color: var(--diLaut); font-weight: 700">Bukukan</button>
<button style="min-height: 52px; border-radius: var(--radius-kartu); border: 1.5px solid var(--tinta); background: var(--permukaan); font-weight: 700">Ubah</button>
<button style="min-height: 44px; border: 0; background: none; color: var(--laut); font-weight: 700">Simpan sebagai draf</button>
<button style="position: relative; overflow: hidden; min-height: 56px; border-radius: var(--radius-kartu); border: 0; background: var(--tinta); color: var(--permukaan); font-weight: 700"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 58%; background: var(--laut)"></span><span style="position: relative">Tutup buku Oktober 2026</span></button>
<button disabled="" style="min-height: 52px; border-radius: var(--radius-kartu); border: 0; background: var(--garis); color: var(--tinta3); font-weight: 700">Bukukan</button>
<div style="font-size: 13px; color: var(--tinta2)">Tidak dapat dilakukan: Mata Anggaran belum dipilih. Tombol nonaktif selalu ditemani alasannya.</div>
</div></div>
</body>
</html>
