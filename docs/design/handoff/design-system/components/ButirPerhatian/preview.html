<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>ButirPerhatian — pratinjau</title>

<style>
html, body { margin: 0; }
body { background: var(--kertas); }
/* tanah: komponen selalu tampil di atas kertas, apa pun latar bingkai pratinjau */
.tanah { background: var(--kertas); color: var(--tinta); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; padding: var(--s20); min-height: 100vh; box-sizing: border-box; }
.pk { display: flex; flex-direction: column; gap: 10px; max-width: 372px; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--laut); outline-offset: 2px; }
a { color: var(--laut); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="tanah"><div class="pk">
<div style="background: var(--permukaan); border: 1.5px solid var(--bata); border-radius: var(--radius-kartu); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><div style="font-size: 13px; font-weight: 700; color: var(--bata); letter-spacing: .3px">HAMBATAN</div><div style="font-weight: 700">Bank BNI ··4821 belum direkonsiliasi</div><div style="font-size: 14px; color: var(--tinta2)">Selisih belum dijelaskan Rp515.000</div><div style="margin-top: 8px; min-height: 44px; border-radius: var(--radius-isian); background: var(--tinta); color: var(--permukaan); font-weight: 700; display: flex; align-items: center; justify-content: center">Buka rekonsiliasi</div></div>

<div style="font-size: 14px; color: var(--tinta2); padding: 4px 2px"><strong style="color: var(--tinta)">Untuk diketahui.</strong> 2 uang muka dengan sisa belum dipertanggungjawabkan</div>
</div></div>
