<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>TombolBersyarat — pratinjau</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; }
body { background: var(--kertas); }
/* tanah: komponen selalu tampil di atas kertas, apa pun latar bingkai pratinjau */
.tanah { background: var(--kertas); color: var(--tinta); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; padding: var(--s20); min-height: 100vh; box-sizing: border-box; }
.pk { display: flex; flex-direction: column; gap: 10px; max-width: 372px; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--laut); outline-offset: 2px; }
a { color: var(--laut); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="tanah"><div class="pk">
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--tinta2)"><span>Berlaku sampai</span><div style="min-height: 48px; border-radius: var(--radius-isian); border: 1px solid var(--tinta3); background: var(--permukaan); padding: 0 14px; display: flex; align-items: center; color: var(--tinta)">10/11/2026</div></div>
<div style="font-size: 14px"><strong style="color: var(--bata)">Tidak dapat dilakukan: Buat pelimpahan.</strong> tanggal berakhir harus setelah hari ini (16/11/2026).</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><button aria-disabled="true" style="flex: 1 1 150px; min-height: 52px; border-radius: var(--radius-kartu); border: 0; background: var(--garis); color: var(--tinta2); font-weight: 700; text-align: center">Buat pelimpahan</button><button style="flex: 1 1 150px; min-height: 52px; border-radius: var(--radius-kartu); border: 0; background: var(--tinta); color: var(--permukaan); font-weight: 700; text-align: center">Buat pelimpahan</button></div>
</div></div>
</body>
</html>
