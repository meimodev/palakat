<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Palakat · Cakupan keadaan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E5A63}a:hover{color:#0A4249}
button{font:inherit;color:inherit;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #0E5A63;outline-offset:2px}
@keyframes masuk{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pudar{from{opacity:0}to{opacity:1}}
@keyframes muncul{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes isi{from{width:0}to{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div style="width: 1400px; height: 1660px; box-sizing: border-box; padding: 56px; background: #F3F5F1; color: #13201C; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; gap: 32px">
  <div><div style="font-size: 36px; font-weight: 700; line-height: 1.1; letter-spacing: -0.5px">Cakupan keadaan</div><div style="color: #43514C; margin-top: 4px">Tiap keadaan dari brief dan layar tempat ia digambar. Yang belum digambar hidup ditandai apa adanya.</div></div>
  <div style="background: #FFFFFF; border: 1px solid #DDE2DB; border-radius: 14px; padding: 0 18px">
    <div style="display: grid; grid-template-columns: 190px minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 12px 0; font-size: 13px; font-weight: 700; color: #43514C"><div>Objek</div><div>Keadaan yang digambar</div><div>Layar</div><div>Belum digambar hidup</div></div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="16">
      <div style="display: grid; grid-template-columns: 190px minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 10px 0; border-top: 1px solid #DDE2DB; font-size: 13px; align-items: start">
        <div style="font-weight: 700; font-size: 14px">{{r.o}}</div><div>{{r.k}}</div>
        <div><sc-for list="{{r.l}}" as="l" hint-placeholder-count="2"><a href="{{l.href}}" style="display: inline-block; margin: 0 10px 2px 0; font-weight: 600">{{l.n}}</a></sc-for></div>
        <div style="color: {{r.fg}}; font-weight: {{r.fw}}">{{r.x}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1400,"height":1660}}'>

</body>
</html>
