<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Palakat · Impor transaksi (ponsel)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E5A63}a:hover{color:#0A4249}
button{font:inherit;color:inherit;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #0E5A63;outline-offset:2px}
@keyframes masuk{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pudar{from{opacity:0}to{opacity:1}}
@keyframes muncul{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes isi{from{width:0}to{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F3F5F1; color: #13201C; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.4">
<sc-if value="{{jk}}" hint-placeholder-val="{{false}}"><div role="status" style="flex: none; background: #13201C; color: #FFFFFF; padding: 10px 24px 8px; font-size: 13px; line-height: 1.3; text-align: center"><strong>Menjalankan jabatan kosong</strong> · Bendahara Jemaat</div></sc-if>
<div style="position: relative; flex: 1; min-height: 0">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 8px"><a href="Lainnya.dc.html" aria-label="Kembali ke Lainnya" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #13201C"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><div style="flex: 1"><h1 style="margin: 0; font-size: 18px; font-weight: 700">Impor</h1><div style="font-size: 13px; color: #43514C">kas-november.xlsx · 5 baris</div></div></div>
  <div style="padding: 0 20px 8px; display: flex; gap: 4px"><sc-for list="{{tahap}}" as="t" hint-placeholder-count="4"><div style="flex: 1; height: 6px; border-radius: 3px; background: {{t.bg}}; border: {{t.bd}}; box-sizing: border-box"></div></sc-for></div>
  <div style="padding: 0 20px 10px"><div style="font-weight: 700; font-size: 15px">{{tahapNama}}</div><div style="font-size: 14px; color: #43514C">{{ket}}</div></div>
  <div style="flex: 1; overflow-y: auto; padding: 4px 20px 20px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="margin-bottom: 10px; background: {{r.bg}}; border: {{r.bd}}; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><div style="font-size: 13px; color: #43514C">Baris {{r.i}}</div><span style="font-size: 13px; font-weight: 700; border-radius: 6px; padding: 3px 9px; background: {{r.hbg}}; color: {{r.hfg}}; border: {{r.hbd}}">{{r.hasil}}</span></div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #43514C">Di file: {{r.asli}}</div>
        <div><div style="font-weight: 600; font-size: 15px">{{r.ur}}</div><div style="font-size: 13px; color: #43514C">Dibaca sebagai: {{r.baca}}</div><div style="font-size: 13px; color: {{r.mfg}}">{{r.ma}}</div></div>
        <sc-if value="{{r.cat}}" hint-placeholder-val="{{false}}"><div style="font-size: 13px; color: #13201C">{{r.cat}}</div></sc-if>
        <sc-if value="{{r.pilih}}" hint-placeholder-val="{{false}}"><div style="display: flex; gap: 8px"><button onClick="{{r.tetap}}" style="flex: 1; min-height: 44px; border-radius: 10px; border: 1.5px solid #13201C; background: #FFFFFF; font-weight: 700; font-size: 14px; text-align: center">Tetap impor</button><button onClick="{{r.tidak}}" style="flex: 1; min-height: 44px; border-radius: 10px; border: 1.5px solid #13201C; background: #FFFFFF; font-weight: 700; font-size: 14px; text-align: center">Tidak diimpor</button></div></sc-if>
      </div>
    </sc-for>
  </div>
  <sc-if value="{{adaAksi}}" hint-placeholder-val="{{true}}"><div style="padding: 12px 20px 22px; background: #FFFFFF; border-top: 1px solid #DDE2DB"><button onClick="{{maju}}" disabled="{{takBisa}}" style="width: 100%; min-height: 52px; border-radius: 14px; border: 0; background: {{btnBg}}; color: {{btnFg}}; font-weight: 700; text-align: center">{{btnTeks}}</button></div></sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"jabatanKosong":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  rp(n) { var s = String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (n < 0 ? '−' : '') + 'Rp' + s; }
  state = { st: 0, ganda: '' };
  rv0() {
    var self = this, s = this.state, st = s.st;
    var NAMA = ['Ditampung', 'Lolos pengecekan', 'Sudah diperiksa', 'Sudah diimpor'];
    var D = [['02/11/26 · Persembahan Mgg · 3.100.000', 'Persembahan Ibadah Minggu', '02/11/2026 · Kas · Rp3.100.000 masuk', 'Pendapatan 1.3.53.07.00 Persembahan Ibadah Minggu', 'ok'], ['04/11/26 · Bayar PLN · -1250000', 'Bayar PLN', '04/11/2026 · Bank BNI ··4821 · Rp1.250.000 keluar', 'Belanja 5.01.02.00 Listrik, air dan telepon', 'ok'], ['4 Nop · PLN nov · 1.250.000,-', 'PLN nov', '04/11/2026 · Bank BNI ··4821 · Rp1.250.000 keluar', 'Belanja 5.01.02.00 Listrik, air dan telepon', 'ganda'], ['08/11/26 · Honor pemusik · 650rb', 'Honor pemusik', '08/11/2026 · Kas · Rp650.000 keluar', '', 'ok'], ['31/11/26 · ATK · 85.000', 'ATK', 'tanggal tidak terbaca · Kas · Rp85.000 keluar', 'Belanja 5.02.01.00 Alat tulis dan fotokopi', 'tolak']];
    var rows = D.map(function (d, i) {
      var j = d[4], h = { hasil: NAMA[Math.min(st, 3)], hbg: st === 3 ? '#13201C' : 'transparent', hfg: st === 3 ? '#FFFFFF' : '#43514C', hbd: st === 3 ? '1.5px solid #13201C' : (st === 0 ? '1.5px dashed #808D87' : '1.5px solid #5E6A66'), cat: '', pilih: false, bg: st === 0 ? 'transparent' : '#FFFFFF', bd: st === 0 ? '1.5px dashed #808D87' : '1px solid #DDE2DB' };
      if (st >= 1 && j === 'tolak') Object.assign(h, { hasil: 'Tidak diimpor', hbg: '#FFFFFF', hfg: '#A63C1C', hbd: '1.5px solid #A63C1C', cat: 'Alasan: tanggal 31/11 tidak ada.' });
      if (st >= 1 && j === 'ganda' && s.ganda === 'tidak') Object.assign(h, { hasil: 'Tidak diimpor', hbg: '#FFFFFF', hfg: '#43514C', hbd: '1.5px solid #5E6A66', cat: 'Alasan: sama dengan baris 2.' });
      if (st >= 1 && j === 'ganda' && !s.ganda) Object.assign(h, { hasil: 'Mungkin ganda', hbg: '#FFFFFF', hfg: '#13201C', hbd: '1.5px solid #13201C', cat: 'Tanggal, Kas/Bank dan jumlah sama dengan baris 2.', pilih: true });
      return Object.assign({ i: i + 1, asli: d[0], ur: d[1], baca: d[2], ma: d[3] || 'Mata Anggaran belum dipilih', mfg: d[3] ? '#43514C' : '#A63C1C', tetap: function () { self.setState({ ganda: 'tetap' }); }, tidak: function () { self.setState({ ganda: 'tidak' }); } }, h);
    });
    var tunggu = st === 1 && !s.ganda;
    return {
      rows: rows, tahapNama: (st + 1) + ' dari 4 · ' + NAMA[st],
      ket: ['Belum ada yang masuk saldo.', tunggu ? 'Putuskan dulu baris yang mungkin ganda.' : 'Pengecekan selesai. Baca sekali lagi.', 'Siap diimpor.', (s.ganda === 'tetap' ? 4 : 3) + ' baris sudah diimpor · ' + (s.ganda === 'tetap' ? 1 : 2) + ' tidak diimpor.'][st],
      tahap: NAMA.map(function (n, i) { var lewat = i <= st; return { bg: lewat ? '#13201C' : 'transparent', bd: lewat ? '0' : '1.5px dashed #808D87' }; }),
      adaAksi: st < 3, takBisa: tunggu, btnTeks: ['Jalankan pengecekan', 'Tandai sudah diperiksa', 'Impor'][st] || '', btnBg: tunggu ? '#DDE2DB' : (st === 2 ? '#0E5A63' : '#13201C'), btnFg: tunggu ? '#5E6A66' : '#FFFFFF',
      maju: function () { if (!tunggu) self.setState({ st: Math.min(3, st + 1) }); }
    };
  }
  tukarJk(o, d) {
    var self = this, ganti = function (s) { var t = s.match(/\d\d\/\d\d\/\d{4}/g) || []; return s.indexOf('Meiske L.') < 0 || t.some(function (x) { return x !== '16/11/2026'; }) ? s : s.split('Meiske L.').join('Yanti Sumual, Operator'); };
    if (d > 5 || !o || typeof o !== 'object') return o;
    Object.keys(o).forEach(function (k) { var v = o[k]; if (typeof v === 'string') o[k] = ganti(v); else if (v && typeof v === 'object') self.tukarJk(v, d + 1); });
    return o;
  }
  renderVals() {
    var V = this.rv0(), jk = !!this.props.jabatanKosong;
    if (jk && false) this.tukarJk(V, 0);
    V.jk = jk; V.tjk = !jk; V.plk = jk ? 'Yanti Sumual, Operator' : 'Meiske L.'; V.plk2 = jk ? 'Yanti Sumual, Operator (menjalankan jabatan kosong Bendahara Jemaat)' : 'Meiske L.';
    return V;
  }
}
</script>
</body>
</html>
